[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dwh-core"
dynamic = ["version"]
description = "The build kernel behind the dwh-* Claude skills: intake gates, bronze/silver/gold/serve, proofs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "duckdb>=1.1,<2",
  "pandas>=2.0",
  "pyarrow>=14",
  "pyyaml>=6.0",
  "openpyxl>=3.1",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30", "plotly>=5.18"]
dev = ["pytest", "ruff"]

[project.scripts]
dwh = "dwh_core.cli:main"

[tool.setuptools]
packages = ["dwh_core"]

[tool.setuptools.package-data]
dwh_core = ["catalogues/*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "dwh_core.VERSION"}
