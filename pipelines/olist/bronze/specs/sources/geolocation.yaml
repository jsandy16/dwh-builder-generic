geolocation:
  role: reference
  connector: local_file
  location: "data/raw/batch_{batch}/olist_geolocation_dataset.csv"
  format: csv
  load_type: incremental_append
  redelivery_policy: reject
  drift_policy: land_and_log
  freshness:
    basis: "none"
  volume:
    min_rows: "NA"
    max_rows: "NA"
  retry_attempts: "3"
  credentials_env: "NA"
  profile_split_by: "NA"
  csv:
    delimiter: ","
    header: "yes"
    quote: "\""
    escape: "\""
    encoding: utf-8
    null_tokens: "NA"
  schema:
    columns:
      geolocation_zip_code_prefix:
        type: VARCHAR
        required: "yes"
        key: "no"
        allowed_values: "NA"
        classification: internal
      geolocation_lat:
        type: DOUBLE
        required: "yes"
        key: "no"
        allowed_values: "NA"
        classification: internal
      geolocation_lng:
        type: DOUBLE
        required: "yes"
        key: "no"
        allowed_values: "NA"
        classification: internal
      geolocation_city:
        type: VARCHAR
        required: "yes"
        key: "no"
        allowed_values: "NA"
        classification: internal
      geolocation_state:
        type: VARCHAR
        required: "yes"
        key: "no"
        allowed_values: "NA"
        classification: internal
