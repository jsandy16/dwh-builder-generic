reviews:
  role: fact
  connector: local_file
  location: "data/raw/batch_{batch}/olist_order_reviews_dataset.csv"
  format: csv
  load_type: incremental_append
  redelivery_policy: replace
  drift_policy: land_and_log
  freshness:
    basis: "none"
  volume:
    min_rows: "NA"
    max_rows: "NA"
  retry_attempts: "3"
  credentials_env: "NA"
  profile_split_by: "NA"
  csv:
    delimiter: ","
    header: "yes"
    quote: "\""
    escape: "\""
    encoding: utf-8
    null_tokens: "NA"
  schema:
    columns:
      review_id:
        type: VARCHAR
        required: "yes"
        key: "yes"
        allowed_values: "NA"
        classification: internal
      order_id:
        type: VARCHAR
        required: "yes"
        key: "yes"
        allowed_values: "NA"
        classification: internal
      review_score:
        type: BIGINT
        required: "yes"
        key: "no"
        allowed_values: "NA"
        classification: internal
      review_comment_title:
        type: VARCHAR
        required: "yes"
        key: "no"
        allowed_values: "NA"
        classification: sensitive
      review_comment_message:
        type: VARCHAR
        required: "yes"
        key: "no"
        allowed_values: "NA"
        classification: sensitive
      review_creation_date:
        type: TIMESTAMP
        required: "yes"
        key: "no"
        allowed_values: "NA"
        classification: internal
      review_answer_timestamp:
        type: TIMESTAMP
        required: "yes"
        key: "no"
        allowed_values: "NA"
        classification: internal
