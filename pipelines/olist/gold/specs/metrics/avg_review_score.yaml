avg_review_score:
  entity: reviews
  plain_definition: Average review score (1–5) of reviews created that day.
  metric_type: average
  numerator:
    measure: "sum:review_score"
    filter: "none"
  denominator:
    measure: count
  filters: "none"
  zero_denominator: "null"
  population: "NA"
  grain:
  - review_creation_date
  time_grain: day
  date_basis: review_creation_date
  unit: score
  precision: "2"
  additivity: non_additive
  valid_range:
    min: "1"
    max: "5"
  cadence: daily
  dispute_owner: sandeep
  version: "1.0.0"
  effective_from: '2026-10-07'
  reconciliation:
    control: count
    excluded_by: "none"
    max_excluded_pct: "0"
  target_table: gold_avg_review_score_day
  golden_values:
  - key:
      review_creation_date: '2017-02-15'
    value: "4.36"
  - key:
      review_creation_date: '2017-02-09'
    value: "4.33"
  - key:
      review_creation_date: '2017-02-18'
    value: "4.35"
